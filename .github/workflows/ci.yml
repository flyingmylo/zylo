name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 解释器由官方 action 提供（进 PATH，行为确定）；
      # uv 只负责加速依赖安装与缓存，不参与解释器管理
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装项目与依赖
        run: |
          uv venv --clear
          uv pip install -e .

      - name: 单元测试
        run: uv run pytest tests/ -q

      - name: Lint（ruff）
        run: uvx ruff check src tests

      - name: 类型检查（pyright）
        run: uvx pyright --project .
